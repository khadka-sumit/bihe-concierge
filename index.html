<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Bihe Concierge — Private Matchmaking</title>
  <meta name="description" content="A premium private matchmaking service for meaningful introductions. Bihe Concierge — thoughtfully curated.">
  <meta name="robots" content="noindex, nofollow">

  <!-- Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,500;0,600;1,300;1,400;1,500&family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">

  <!-- Styles -->
  <link rel="stylesheet" href="css/variables.css">
  <link rel="stylesheet" href="css/global.css">
  <link rel="stylesheet" href="css/animations.css">
  <link rel="stylesheet" href="css/components.css">
  <link rel="stylesheet" href="css/responsive.css">

  <style>
    /* Entry screen — full viewport dark cinematic */
    .entry-page {
      position: relative;
      width: 100%;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      overflow: hidden;
      background: var(--color-black);
    }

    /* Hero background */
    .entry-bg {
      position: absolute;
      inset: 0;
      z-index: 0;
    }

    .entry-bg img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      object-position: center;
      animation: slowZoom 18s ease-in-out infinite alternate;
    }

    /* Multi-layer overlay for mood */
    .entry-bg::after {
      content: '';
      position: absolute;
      inset: 0;
      background:
        linear-gradient(
          to bottom,
          rgba(9, 7, 6, 0.55) 0%,
          rgba(59, 10, 16, 0.20) 30%,
          rgba(59, 10, 16, 0.20) 60%,
          rgba(9, 7, 6, 0.85) 100%
        );
    }

    /* Radial vignette */
    .entry-vignette {
      position: absolute;
      inset: 0;
      z-index: 1;
      pointer-events: none;
      background: radial-gradient(
        ellipse at center,
        transparent 40%,
        rgba(9, 7, 6, 0.55) 100%
      );
    }

    /* Central content */
    .entry-content {
      position: relative;
      z-index: 2;
      display: flex;
      flex-direction: column;
      align-items: center;
      text-align: center;
      padding: var(--space-8) var(--space-8);
      max-width: 680px;
    }

    /* Logo */
    .entry-logo {
      margin-bottom: var(--space-12);
      animation: fadeDown 1s var(--ease-luxury) 0.2s both;
    }

    /* Ornament between logo and headline */
    .entry-ornament {
      width: 60px;
      height: 1px;
      background: linear-gradient(90deg, transparent, var(--color-gold), transparent);
      margin-bottom: var(--space-10);
      animation: fadeIn 1s var(--ease-luxury) 0.5s both;
    }

    /* Main headline */
    .entry-headline {
      font-family: var(--font-serif);
      font-size: var(--text-5xl);
      font-weight: 300;
      font-style: italic;
      color: var(--color-ivory);
      line-height: var(--leading-snug);
      letter-spacing: var(--tracking-tight);
      margin-bottom: var(--space-12);
    }

    /* Separator below headline */
    .entry-sep {
      display: flex;
      align-items: center;
      gap: var(--space-4);
      margin-bottom: var(--space-10);
      animation: fadeIn 0.8s var(--ease-luxury) 1.1s both;
      opacity: 0;
    }

    .entry-sep::before,
    .entry-sep::after {
      content: '';
      width: 40px;
      height: 1px;
      background: rgba(185, 149, 90, 0.5);
    }

    .entry-sep span {
      width: 5px;
      height: 5px;
      border-radius: 50%;
      background: var(--color-gold);
    }

    /* CTA button */
    .entry-cta-wrap {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: var(--space-6);
    }

    .entry-cta-btn {
      display: inline-flex;
      align-items: center;
      gap: var(--space-4);
      height: 60px;
      padding: 0 var(--space-12);
      background: transparent;
      border: 1px solid rgba(246, 240, 231, 0.35);
      border-radius: var(--radius-md);
      color: var(--color-ivory);
      font-family: var(--font-sans);
      font-size: var(--text-xs);
      font-weight: 500;
      letter-spacing: var(--tracking-widest);
      text-transform: uppercase;
      cursor: pointer;
      transition:
        background var(--duration-slow) var(--ease-luxury),
        border-color var(--duration-slow) var(--ease-luxury),
        transform var(--duration-slow) var(--ease-luxury);
      position: relative;
      overflow: hidden;
    }

    .entry-cta-btn::before {
      content: '';
      position: absolute;
      inset: 0;
      background: rgba(126, 7, 21, 0);
      transition: background var(--duration-slow) var(--ease-luxury);
    }

    .entry-cta-btn:hover {
      border-color: rgba(246, 240, 231, 0.65);
      transform: translateY(-2px);
    }

    .entry-cta-btn:hover::before {
      background: rgba(126, 7, 21, 0.25);
    }

    .entry-cta-arrow {
      transition: transform var(--duration-base) var(--ease-luxury);
    }

    .entry-cta-btn:hover .entry-cta-arrow {
      transform: translateX(4px);
    }

    /* Footer label */
    .entry-footer-label {
      font-family: var(--font-sans);
      font-size: var(--text-xs);
      letter-spacing: var(--tracking-widest);
      text-transform: uppercase;
      color: rgba(246, 240, 231, 0.25);
    }

    /* Bottom fixed text */
    .entry-bottom {
      position: absolute;
      bottom: var(--space-8);
      left: 50%;
      transform: translateX(-50%);
      z-index: 2;
      text-align: center;
    }

    .entry-bottom__text {
      font-family: var(--font-sans);
      font-size: var(--text-xs);
      letter-spacing: var(--tracking-widest);
      text-transform: uppercase;
      color: rgba(246, 240, 231, 0.20);
    }

    /* Sweep line for exit transition */
    .entry-sweep-line {
      position: fixed;
      left: 0;
      top: 50%;
      width: 100%;
      height: 2px;
      background: var(--color-burgundy);
      transform: scaleX(0);
      transform-origin: left center;
      z-index: 999;
      pointer-events: none;
    }

    /* Full-screen fade overlay for exit */
    .entry-exit-overlay {
      position: fixed;
      inset: 0;
      background: var(--color-ivory);
      z-index: 998;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.5s var(--ease-in-out);
    }

    /* Responsive headline */
    @media (max-width: 768px) {
      .entry-headline {
        font-size: var(--text-3xl);
      }
      .entry-cta-btn {
        padding: 0 var(--space-10);
      }
    }
  </style>
</head>
<body style="background: var(--color-black); overflow: hidden;">

<div class="grain-overlay" aria-hidden="true"></div>

<!-- Exit transition elements -->
<div class="entry-sweep-line" id="sweepLine" aria-hidden="true"></div>
<div class="entry-exit-overlay" id="exitOverlay" aria-hidden="true"></div>

<main class="entry-page" id="entryPage">

  <!-- Background image with CSS fallback -->
  <div class="entry-bg img-placeholder-dark">
    <img
      src="assets/images/hero-entry.webp"
      alt="Cinematic Nepali heritage corridor with warm candlelight"
      loading="eager"
      onerror="this.style.display='none'"
    >
  </div>

  <div class="entry-vignette" aria-hidden="true"></div>

  <!-- Central content -->
  <div class="entry-content">

    <!-- Logo -->
    <div class="entry-logo">
      <a href="index.html" class="bc-logo" aria-label="Bihe Concierge">
        <svg class="bc-logo__ornament" viewBox="0 0 24 24" fill="none" aria-hidden="true">
          <path d="M12 2 L13.8 8.2 L20 8.2 L14.9 12.1 L16.7 18.3 L12 14.4 L7.3 18.3 L9.1 12.1 L4 8.2 L10.2 8.2 Z" stroke="currentColor" stroke-width="1" fill="none"/>
        </svg>
        <span class="bc-logo__name">BIHE</span>
        <span class="bc-logo__subtitle">CONCIERGE</span>
      </a>
    </div>

    <div class="entry-ornament" aria-hidden="true"></div>

    <!-- Main headline -->
    <h1 class="entry-headline headline-reveal" id="entryHeadline">
      <span class="line-inner">Every great love story</span>
      <span class="line-inner">begins with knowing</span>
      <span class="line-inner">yourself.</span>
    </h1>

    <div class="entry-sep" aria-hidden="true">
      <span></span>
    </div>

    <!-- CTA -->
    <div class="entry-cta-wrap entry-cta">
      <button
        class="entry-cta-btn"
        id="readyBtn"
        aria-label="Begin your application journey"
      >
        I'M READY
        <span class="entry-cta-arrow" aria-hidden="true">→</span>
      </button>

      <p class="entry-footer-label entry-footer">Begin your journey</p>
    </div>

  </div>

  <!-- Bottom label -->
  <div class="entry-bottom">
    <p class="entry-bottom__text">Private &amp; Confidential</p>
  </div>

</main>

<!-- Scripts -->
<script src="js/auth.js"></script>
<script>
  (function () {

    // Reveal headline lines after paint
    const headline = document.getElementById('entryHeadline');
    if (headline) {
      // Small delay to ensure fonts are loaded before revealing
      setTimeout(() => {
        headline.classList.add('is-visible');
      }, 200);
    }

    // ── I'M READY transition ──────────────────────────────
    const readyBtn    = document.getElementById('readyBtn');
    const sweepLine   = document.getElementById('sweepLine');
    const exitOverlay = document.getElementById('exitOverlay');
    const entryPage   = document.getElementById('entryPage');

    readyBtn.addEventListener('click', () => {
      readyBtn.disabled = true;

      // Step 1: Subtle hero zoom acceleration (already animating)
      // Step 2: Headline drifts up
      entryPage.style.transition = 'transform 0.7s var(--ease-luxury)';
      entryPage.style.transform  = 'translateY(-12px)';

      // Step 3: Red sweep line
      setTimeout(() => {
        sweepLine.style.animation = 'redSweep 0.65s var(--ease-luxury) forwards';
      }, 150);

      // Step 4: Ivory fade overlay
      setTimeout(() => {
        exitOverlay.style.pointerEvents = 'all';
        exitOverlay.style.opacity = '1';
      }, 550);

      // Step 5: Redirect
      setTimeout(() => {
        window.location.href = 'application.html';
      }, 1100);
    });

    // Keyboard support for the CTA
    readyBtn.addEventListener('keydown', (e) => {
      if (e.key === 'Enter' || e.key === ' ') {
        e.preventDefault();
        readyBtn.click();
      }
    });

  })();
</script>

</body>
</html>
