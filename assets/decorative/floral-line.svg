<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 20" fill="none">
  <!-- Elegant floral line divider for ivory sections -->

  <!-- Left line -->
  <line x1="0" y1="10" x2="110" y2="10" stroke="#B9955A" stroke-width="0.6" opacity="0.4"/>

  <!-- Left small diamond -->
  <path d="M108,10 L113,7 L118,10 L113,13 Z" stroke="#B9955A" stroke-width="0.6" fill="none" opacity="0.5"/>

  <!-- Centre lotus flower motif -->
  <!-- Petals -->
  <g stroke="#B9955A" stroke-width="0.7" fill="none" opacity="0.65">
    <ellipse cx="150" cy="10" rx="3" ry="7" transform="rotate(0 150 10)"/>
    <ellipse cx="150" cy="10" rx="3" ry="7" transform="rotate(60 150 10)"/>
    <ellipse cx="150" cy="10" rx="3" ry="7" transform="rotate(120 150 10)"/>
    <ellipse cx="150" cy="10" rx="3" ry="7" transform="rotate(180 150 10)"/>
    <ellipse cx="150" cy="10" rx="3" ry="7" transform="rotate(240 150 10)"/>
    <ellipse cx="150" cy="10" rx="3" ry="7" transform="rotate(300 150 10)"/>
    <!-- Centre -->
    <circle cx="150" cy="10" r="2" fill="#B9955A" opacity="0.5"/>
  </g>

  <!-- Right small diamond -->
  <path d="M182,10 L187,7 L192,10 L187,13 Z" stroke="#B9955A" stroke-width="0.6" fill="none" opacity="0.5"/>

  <!-- Right line -->
  <line x1="190" y1="10" x2="300" y2="10" stroke="#B9955A" stroke-width="0.6" opacity="0.4"/>
</svg>
