<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 12" fill="none">
  <!-- Minimal ornamental divider — pair of mirrored brackets with centre dot -->

  <!-- Left bracket -->
  <path d="M0,6 C20,6 30,2 40,2 L80,2" stroke="#B9955A" stroke-width="0.7" stroke-linecap="round" opacity="0.45"/>
  <path d="M0,6 C20,6 30,10 40,10 L80,10" stroke="#B9955A" stroke-width="0.7" stroke-linecap="round" opacity="0.45"/>

  <!-- Centre ornament -->
  <circle cx="100" cy="6" r="3" stroke="#B9955A" stroke-width="0.7" fill="none" opacity="0.6"/>
  <circle cx="100" cy="6" r="1" fill="#B9955A" opacity="0.55"/>

  <!-- Right bracket (mirrored) -->
  <path d="M120,2 L160,2 C170,2 180,6 200,6" stroke="#B9955A" stroke-width="0.7" stroke-linecap="round" opacity="0.45"/>
  <path d="M120,10 L160,10 C170,10 180,6 200,6" stroke="#B9955A" stroke-width="0.7" stroke-linecap="round" opacity="0.45"/>
</svg>
