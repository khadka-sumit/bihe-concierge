<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 80 80" fill="none">
  <!--
    Wax seal emblem — circular seal shape with "BC" monogram.
    Use as a decorative stamp / brand mark.
  -->

  <!-- Outer seal edge (serrated ring effect via dashes) -->
  <circle cx="40" cy="40" r="37"
    stroke="#7E0715"
    stroke-width="1.5"
    stroke-dasharray="3 2.5"
    opacity="0.7"
  />

  <!-- Inner ring -->
  <circle cx="40" cy="40" r="30"
    stroke="#7E0715"
    stroke-width="0.8"
    opacity="0.5"
  />

  <!-- Seal fill -->
  <circle cx="40" cy="40" r="28"
    fill="#580710"
    opacity="0.85"
  />

  <!-- Subtle highlight -->
  <circle cx="32" cy="32" r="10"
    fill="white"
    opacity="0.04"
  />

  <!-- "BC" monogram -->
  <text
    x="40" y="46"
    font-family="Georgia, serif"
    font-size="18"
    font-weight="400"
    fill="#F6F0E7"
    text-anchor="middle"
    opacity="0.85"
    letter-spacing="2"
  >BC</text>

  <!-- Decorative dots at cardinal points of inner ring -->
  <g fill="#B9955A" opacity="0.55">
    <circle cx="40" cy="11" r="1.5"/>
    <circle cx="69" cy="40" r="1.5"/>
    <circle cx="40" cy="69" r="1.5"/>
    <circle cx="11" cy="40" r="1.5"/>
  </g>
</svg>
